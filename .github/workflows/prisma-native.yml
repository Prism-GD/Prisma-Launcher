name: Prisma micro-prototype

on:
  push:
    branches:
      - main
      - prisma/bootstrap
    paths:
      - "native/prisma_runtime/**"
      - "app/src/main/cpp/**"
      - "app/src/main/java/dev/prisma/launcher/runtime/**"
      - "docs/MICRO_PROTOTYPE.md"
      - ".github/workflows/prisma-native.yml"
  pull_request:
    paths:
      - "native/prisma_runtime/**"
      - "docs/MICRO_PROTOTYPE.md"
      - ".github/workflows/prisma-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    name: Build native core and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Prisma
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S native/prisma_runtime -B build -DPRISMA_BUILD_TESTS=ON

      - name: Build native core
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  android-arm64-core:
    name: Cross-compile Android ARM64 core
    runs-on: ubuntu-latest
    steps:
      - name: Check out Prisma
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Android ARM64 build
        run: |
          cmake -S app/src/main/cpp -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static \
            -DPRISMA_NATIVE_ROOT="$GITHUB_WORKSPACE/native/prisma_runtime"

      - name: Compile Android ARM64 shared runtime
        run: |
          cmake --build build-android-arm64 --parallel
          test -f build-android-arm64/prisma_runtime/libprisma_overlay_state.so
          test -f build-android-arm64/libprisma_launcher_jni.so

      - name: Upload Android ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: prisma-android-arm64-runtime
          path: |
            build-android-arm64/libprisma_launcher_jni.so
            build-android-arm64/prisma_runtime/libprisma_overlay_state.so
          if-no-files-found: error
          retention-days: 14

  cocos2d-adapter:
    name: Compile Cocos2d-x adapter
    runs-on: ubuntu-latest
    steps:
      - name: Check out Prisma
        uses: actions/checkout@v4

      - name: Check out pinned Cocos2d-x headers
        uses: actions/checkout@v4
        with:
          repository: cocos2d/cocos2d-x
          ref: cocos2d-x-3.17.2
          path: third_party/cocos2d-x

      - name: Install Cocos2d-x desktop headers
        run: sudo apt-get update && sudo apt-get install -y libglew-dev libgl1-mesa-dev libglfw3-dev

      - name: Configure adapter build
        run: |
          cmake -S native/prisma_runtime -B build-cocos \
            -DPRISMA_BUILD_TESTS=OFF \
            -DPRISMA_WITH_COCOS2D=ON \
            -DCOCOS2D_INCLUDE_DIR="$GITHUB_WORKSPACE/third_party/cocos2d-x/cocos"

      - name: Compile adapter
        run: cmake --build build-cocos --parallel
